name: AssettoServer Otomatik Güncelleme (LFS + Release)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Git LFS Kurulumu ve Takibi
        run: |
          git lfs install
          git lfs track "acServer.exe"
          git lfs track "AssettoServer.exe"
          git lfs track "*.exe"
          git lfs track "*.dll"

      - name: En Güncel Windows Release Zip Dosyasını Tespit Et ve İndir
        run: |
          echo "Hedef repodan son sürüm bilgileri alınıyor..."
          LATEST_RELEASE_JSON=$(curl -s https://api.github.com/repos/compujuckel/AssettoServer/releases/latest)
          
          DOWNLOAD_URL=$(echo "$LATEST_RELEASE_JSON" | grep -oE "https://github.com/[^\"]+/assetto-server-win-x64\.zip" | head -n 1)
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Hata: assetto-server-win-x64.zip dosyası release içinde bulunamadı!"
            exit 1
          fi
          
          curl -L "$DOWNLOAD_URL" -o assetto_latest.zip

      - name: Zip İçeriğini Çıkart ve Düzenle
        run: |
          mkdir -p temp_extract
          unzip -o assetto_latest.zip -d temp_extract
          
          if [ -f "temp_extract/AssettoServer.exe" ]; then
            mv temp_extract/AssettoServer.exe temp_extract/acServer.exe
          fi
          
          cp -rf temp_extract/* ./
          rm -rf assetto_latest.zip temp_extract

      - name: Release İçin Zip Paketini /tmp Dizininde Oluştur
        run: |
          # Zip dosyasını repo DIŞINDA (/tmp) oluşturuyoruz
          zip -r /tmp/AssettoServer-Hazir-Sunucu.zip ./* -x ".git/*" ".github/*"

      - name: Değişiklikleri Repoya Pushla (LFS ile)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .gitattributes
          git add .
          
          # Remote ile yerel geçmişi sıfırlayıp çakışmayı önle
          git fetch origin main
          git reset --soft origin/main
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Otomatik Güncelleme: acServer.exe güncellendi"
            git push origin main
          else
            echo "Değişiklik yok, push atılmadı."
          fi

      - name: GitHub Release Yayınla / Güncelle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "AssettoServer Son Sürüm (Hazır İndirilebilir Paket)"
          body: "Bu sürüm otomatik olarak GitHub Actions tarafından oluşturulmuştur. LFS pointer sorunu olmadan tam dosyaları içerir."
          draft: false
          prerelease: false
          files: |
            /tmp/AssettoServer-Hazir-Sunucu.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
